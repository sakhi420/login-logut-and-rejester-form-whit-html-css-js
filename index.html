<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت کاربران</title>
    <!-- اتصال فایل استایل پروژه خودتان -->
    <link rel="stylesheet" href="style.css">
    
    <!-- 🎯 ۱. اضافه شدن استایل سوییت‌الرت به صورت آفلاین برای ظاهر پاپ‌آپ‌ها -->
    <link rel="stylesheet" href="./node_modules/sweetalert2/dist/sweetalert2.min.css">
</head>
<body>
    <form>
        <input type="text" id="name" placeholder="نام"><br><br>
        <input type="text" id="last-name" placeholder="نام خانوادگی"><br><br>
        <input type="number" id="age" placeholder="سن">
        <button id="btn">ارسال</button>
    </form>
    
    <h1 class="h1">تعداد کاربران: </h1>
    <div class="userContainer"></div>

    <!-- ۲. اتصال کتابخانه آیکون‌های لوسید -->
    <script src="./node_modules/lucide/dist/umd/lucide.min.js"></script>
    
    <!-- 🎯 ۳. اضافه شدن اسکریپت اصلی سوییت‌الرت (باید حتماً قبل از app.js باشد) -->
    <script src="./node_modules/sweetalert2/dist/sweetalert2.all.min.js"></script>
    
    <!-- ۴. اتصال کد جاوااسکریپت پروژه شما -->
    <script src="app.js"></script>
</body>
</html>
