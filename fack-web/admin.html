<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت سیستم</title>
    <link rel="stylesheet" href="styles/admin.css">
    <link rel="stylesheet" href="../node_modules/sweetalert2/dist/sweetalert2.min.css">
</head>
<body>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="sidebar-brand">
                <i data-lucide="shield-check"></i>
                <h2>مدیریت کل</h2>
            </div>
            <nav class="sidebar-menu">
                <a href="#" class="active"><i data-lucide="users"></i><span>لیست کاربران</span></a>
                <a href="profile.html"><i data-lucide="user"></i><span>پروفایل من</span></a>
                <a href="#"><i data-lucide="bar-chart-3"></i><span>گزارشات سیستم</span></a>
            </nav>
            <div class="sidebar-footer">
                <button id="logout-btn"><i data-lucide="log-out"></i><span>خروج</span></button>
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <div class="header-title">
                    <h1> مدیریت سیستم</h1>
                    <p>به پنل نظارت و کنترل کاربران خوش آمدید</p>
                </div>
                <div class="admin-profile-badge">
                    <span class="badge-admin">مدیر سیستم</span>
                </div>
            </header>

            <section class="admin-stats">
                <div class="stat-box">
                    <div class="stat-icon blue"><i data-lucide="users-round"></i></div>
                    <div class="stat-data">
                        <h3 id="total-users">---</h3>
                        <p>کل کاربران ثبت شده</p>
                    </div>
                </div>
                <div class="stat-box">
                    <div class="stat-icon green"><i data-lucide="user-cog"></i></div>
                    <div class="stat-data">
                        <h3 id="total-admins">---</h3>
                        <p>تعداد کل مدیران</p>
                    </div>
                </div>
                <div class="stat-box">
                    <div class="stat-icon orange"><i data-lucide="calendar-heart"></i></div>
                    <div class="stat-data">
                        <h3 id="average-age">---</h3>
                        <p>میانگین سن کاربران</p>
                    </div>
                </div>
            </section>

            <section class="table-section">
                <div class="table-header">
                    <div class="table-title">
                        <i data-lucide="list"></i>
                        <h3>لیست کل اعضای دیتابیس</h3>
                    </div>
                    <button class="btn-refresh" onclick="location.reload(getUsers())"><i data-lucide="refresh-cw"></i> بروزرسانی</button>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>شناسه (ID)</th>
                                <th>نام</th>
                                <th>نام خانوادگی</th>
                                <th>سن</th>
                                <th>آدرس ایمیل</th>
                                <th>نقش (Role)</th>
                                <th>عملیات</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body">
                            <tr>
                               
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="edit-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i data-lucide="user-cog"></i> ویرایش اطلاعات کاربر</h3>
                <button type="button" class="close-modal-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="modal-edit-form">
                <input type="hidden" id="edit-user-id">
                
                <div class="modal-form-group">
                    <label>نام:</label>
                    <input type="text" id="edit-name" required>
                </div>
                <div class="modal-form-group">
                    <label>نام خانوادگی:</label>
                    <input type="text" id="edit-family" required>
                </div>
                <div class="modal-form-group">
                    <label>سن:</label>
                    <input type="number" id="edit-age" required>
                </div>
                <div class="modal-form-group">
                    <label>نقش (Role):</label>
                    <select id="edit-role">
                        <option value="user">user</option>
                        <option value="admin">admin</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()">انصراف</button>
                    <button type="submit" class="btn-submit">ذخیره تغییرات</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../node_modules/lucide/dist/umd/lucide.min.js"></script>
    <script src="../node_modules/sweetalert2/dist/sweetalert2.all.min.js"></script>
    
    <script src="js/admin.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
