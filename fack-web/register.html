<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام در سیستم</title>
    <link rel="stylesheet" href="styles/register.css">
    <link rel="stylesheet" href="../node_modules/sweetalert2/dist/sweetalert2.min.css">
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <i data-lucide="user-plus" class="main-icon"></i>
            <h2>ساخت حساب کاربری</h2>
            <p>لطفاً مشخصات خود را برای عضویت وارد کنید</p>
        </div>

        <form id="register-form">
            <!-- فیلد نام -->
            <div class="input-group">
                <i data-lucide="user" class="input-icon"></i>
                <input type="text" id="name" placeholder="نام" required>
            </div>

            <!-- فیلد نام خانوادگی -->
            <div class="input-group">
                <i data-lucide="contact" class="input-icon"></i>
                <input type="text" id="last-name" placeholder="نام خانوادگی" required>
            </div>

            <!-- فیلد سن -->
            <div class="input-group">
                <i data-lucide="calendar-days" class="input-icon"></i>
                <input type="number" id="age" placeholder="سن" min="1" required>
            </div>

            <!-- فیلد ایمیل -->
            <div class="input-group">
                <i data-lucide="mail" class="input-icon"></i>
                <input type="email" id="email" placeholder="ایمیل یا نام کاربری" required>
            </div>

            <!-- فیلد رمز عبور -->
            <div class="input-group">
                <i data-lucide="key-round" class="input-icon"></i>
                <input type="password" id="password" placeholder="رمز عبور" required>
            </div>

            <button type="submit" id="login-btn">عضویت در سیستم</button>
        </form>

        <div class="login-footer">
            <p>قبلاً حساب کاربری ساخته‌اید؟ <a href="login.html">وارد شوید</a></p>
        </div>
    </div>

    <script src="../node_modules/lucide/dist/umd/lucide.min.js"></script>
    <script src="../node_modules/sweetalert2/dist/sweetalert2.all.min.js"></script>
    
    <script src="js/register.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
